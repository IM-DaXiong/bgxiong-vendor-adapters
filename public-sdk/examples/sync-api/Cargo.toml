[workspace]
members = ["."]

[package]
name = "bgx-example-sync-api"
version = "1.0.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bgx-adapter-v2-sdk = { path = "../../sdk/rust" }
serde_json = { version = "=1.0.149", default-features = false, features = ["alloc", "arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false }

[profile.release]
panic = "abort"
debug = 0
incremental = false

