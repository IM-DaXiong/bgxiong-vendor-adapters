[package]
name = "comfyui-lan-z-image-turbo-adapter"
version = "0.3.0"
edition = "2021"
publish = false

[package.metadata.component]
package = "local:example-comfyui-lan-z-image"

[package.metadata.component.target]
path = "wit/vendor-adapter.wit"
world = "vendor-adapter"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bgx-vendor-adapter-sdk = { path = "vendor-sdk" }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wit-bindgen = { version = "0.51", default-features = false, features = ["macros", "realloc"] }
dlmalloc = { version = "0.2", features = ["global"] }
