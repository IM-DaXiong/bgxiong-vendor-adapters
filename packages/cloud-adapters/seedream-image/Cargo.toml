[workspace]
members = ["."]
exclude = ["vendor-sdk/sdk/rust"]

[package]
name = "bgx-seedream-image"
version = "1.0.4"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bgx-adapter-v2-sdk = { path = "vendor-sdk/sdk/rust" }
serde_json = { version = "=1.0.149", default-features = false, features = ["alloc", "arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false }
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }

[profile.release]
panic = "abort"
debug = 0
incremental = false
