[workspace]

[package]
name = "bgx-wan22-animate"
version = "0.2.3"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
bgx-adapter-v2-sdk = { path = "../../../contract/v2/sdk/rust" }
serde_json = { version = "=1.0.149", default-features = false, features = ["alloc", "arbitrary_precision"] }
sha2 = { version = "=0.10.9", default-features = false }

[profile.release]
panic = "abort"
debug = 0
incremental = false